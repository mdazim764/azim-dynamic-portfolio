<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azim's Admin Workspace</title>
    
    <!-- Fonts & Cropper.js for Image Editing -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    
    <style>
        /* === PREMIUM DESIGN VARIABLES (Matched with Portfolio) === */
        :root {
            --bg: #f8fafc; --text-main: #0f172a; --text-muted: #64748b;
            --card-bg: rgba(255, 255, 255, 0.7); --card-border: rgba(255, 255, 255, 0.4);
            --brand: #0d9488; --brand-glow: rgba(13, 148, 136, 0.3); --accent: #f97316;
            --btn-text: #ffffff; --sidebar: #0f172a;
        }

        [data-theme="dark"] {
            --bg: #090e17; --text-main: #f1f5f9; --text-muted: #94a3b8;
            --card-bg: rgba(16, 23, 42, 0.6); --card-border: rgba(255, 255, 255, 0.05);
            --brand: #2dd4bf; --brand-glow: rgba(45, 212, 191, 0.3); --accent: #fb923c;
            --btn-text: #090e17; --sidebar: #05080f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Manrope", sans-serif; color: var(--text-main); background: var(--bg); transition: 0.3s; display: flex; height: 100vh; overflow: hidden; }

        /* Login Screen Override */
        #loginWrapper { position: absolute; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: var(--bg); backdrop-filter: blur(10px); }
        .login-card { width: 100%; max-width: 400px; padding: 40px; text-align: center; }

        /* Sidebar */
        .sidebar { width: 280px; background: var(--sidebar); color: #f1f5f9; display: flex; flex-direction: column; padding: 24px; z-index: 10; border-right: 1px solid var(--card-border); }
        .sidebar h2 { font-family: "Space Grotesk", sans-serif; color: var(--brand); margin-bottom: 30px; letter-spacing: -0.5px; }
        .sidebar button { background: transparent; border: none; color: #94a3b8; padding: 14px 20px; text-align: left; cursor: pointer; font-size: 1rem; border-radius: 12px; margin-bottom: 8px; font-weight: 500; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
        .sidebar button:hover { color: #f1f5f9; background: rgba(255,255,255,0.05); }
        .sidebar button.active { background: var(--brand-glow); color: var(--brand); font-weight: 700; }
        .theme-toggle-container { margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        
        /* Main Layout */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; scroll-behavior: smooth; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .header-top h1 { font-family: "Space Grotesk", sans-serif; font-size: 2rem; margin: 0; }
        
        /* Cards & Forms */
        .card { background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(16px); border-radius: 24px; padding: 32px; box-shadow: 0 8px 32px rgba(0,0,0,0.03); margin-bottom: 30px; }
        label { font-weight: 600; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; display: block; margin-top: 16px; text-transform: uppercase; letter-spacing: 0.5px; }
        input, textarea { width: 100%; padding: 14px; background: rgba(0,0,0,0.03); border: 1px solid var(--card-border); border-radius: 12px; color: var(--text-main); font-family: inherit; font-size: 1rem; transition: 0.2s; }
        [data-theme="dark"] input, [data-theme="dark"] textarea { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.1); }
        input:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-glow); }
        
        /* Buttons */
        .btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px; border-radius: 12px; font-weight: 700; transition: 0.3s; cursor:pointer; font-size: 0.95rem; border: none; }
        .btn.primary { background: var(--brand); color: var(--btn-text); box-shadow: 0 4px 15px var(--brand-glow); width: 100%; margin-top: 24px; }
        .btn.primary:hover { transform: translateY(-3px); box-shadow: 0 8px 25px var(--brand-glow); }
        .btn-action { background: transparent; border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 8px; color: var(--text-main); font-size: 0.85rem; cursor: pointer; transition: 0.2s;}
        .btn-action:hover { border-color: var(--brand); color: var(--brand); }
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-danger:hover { background: #ef4444; color: white; }

        /* Lists */
        .list-item { padding: 20px; border: 1px solid var(--card-border); background: rgba(0,0,0,0.01); border-radius: 16px; margin-bottom: 16px; position: relative; transition: 0.2s; }
        [data-theme="dark"] .list-item { background: rgba(255,255,255,0.02); }
        .list-item:hover { border-color: var(--brand-glow); }
        .list-actions { position: absolute; right: 20px; top: 20px; display: flex; gap: 8px; }
        .tech-badge { background: var(--brand-glow); padding: 4px 10px; border-radius: 99px; font-size: 0.8rem; margin-right: 5px; color: var(--brand); display: inline-block; margin-top: 8px; font-weight: 700;}

        /* Image Cropper Modal */
        #cropModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px;}
        .crop-container { background: var(--card-bg); padding: 20px; border-radius: 20px; width: 100%; max-width: 500px; backdrop-filter: blur(20px); border: 1px solid var(--card-border);}
        .img-workspace { width: 100%; max-height: 400px; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginWrapper">
        <div class="card login-card">
            <h2 style="font-family: 'Space Grotesk'; font-size: 1.8rem; margin-bottom: 10px;">Workspace Access</h2>
            <p style="color: var(--text-muted); margin-bottom: 30px;">Verify your identity to proceed.</p>
            <form id="loginForm">
                <input type="password" id="adminPassword" placeholder="Enter VIP Password" required style="text-align: center; font-size: 1.2rem; letter-spacing: 5px;">
                <button type="submit" class="btn primary">Unlock Admin Panel</button>
            </form>
        </div>
    </div>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2>AK <span style="font-weight:400; opacity:0.5">/</span> ADMIN</h2>
        <button onclick="switchTab('profile')" id="tab-profile" class="active">👤 Hero & Profile</button>
        <button onclick="switchTab('projects')" id="tab-projects">🚀 Projects</button>
        <button onclick="switchTab('experience')" id="tab-experience">💼 Experience</button>
        <button onclick="switchTab('education')" id="tab-education">🎓 Education</button>
        <button onclick="switchTab('skills')" id="tab-skills">🛠️ Skills</button>
        <button onclick="switchTab('achievements')" id="tab-achievements">🏆 Achievements</button>
        <button onclick="switchTab('courses')" id="tab-courses">📚 Courses</button>
        
        <div class="theme-toggle-container">
            <button id="themeToggle" style="width: 100%; justify-content: center; background: rgba(255,255,255,0.05);">🌙 Dark Mode</button>
        </div>
    </aside>

    <!-- CONTENT AREA -->
    <main class="main-content" id="dashboardMain">
        <div class="header-top">
            <h1 id="dashboardTitle">Hero & Profile Setup</h1>
            <button onclick="logout()" class="btn-action btn-danger">Exit Workspace 🚪</button>
        </div>

        <!-- PROFILE TAB -->
        <div id="content-profile" class="tab-content active">
            <div class="card">
                <form id="profileForm">
                    <input type="hidden" id="profId">
                    
                    <!-- NEW IMAGE UPLOADER -->
                    <div style="display: flex; gap: 30px; align-items: center; padding: 20px; background: rgba(0,0,0,0.02); border-radius: 16px; border: 1px dashed var(--brand); margin-bottom: 24px;">
                        <img id="imagePreview" src="https://via.placeholder.com/130?text=No+Image" style="width: 120px; height: 120px; border-radius: 30px; object-fit: cover; border: 4px solid var(--card-bg); box-shadow: 0 8px 20px rgba(0,0,0,0.1);">
                        <div style="flex: 1;">
                            <label style="margin-top:0;">Profile Avatar (Perfect 1:1 Square)</label>
                            <input type="file" id="profImageFile" accept="image/png, image/jpeg, image/jpg" style="padding: 10px; background: transparent; border:none;">
                            <input type="hidden" id="profImageBase64">
                            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 5px;">Upload triggers crop wizard. Automatically optimizes for MongoDB.</p>
                        </div>
                    </div>

                    <div style="display: flex; gap: 20px;">
                        <div style="flex: 1;"><label>Full Name</label> <input type="text" id="profName" required></div>
                        <div style="flex: 1;"><label>Eyebrow Tag (M.Tech CSE...)</label> <input type="text" id="profEyebrow" required></div>
                    </div>
                    <label>Hero Subtitle</label> <input type="text" id="profSubtitle" required>
                    <label>Hero Paragraph (Lead)</label> <textarea id="profLead" rows="2"></textarea>
                    <label>About Me (Use Enter for paragraphs)</label> <textarea id="profAbout" rows="4"></textarea>
                    
                    <div style="display: flex; gap: 20px;">
                        <div style="flex: 1;"><label>Program Snapshot</label> <input type="text" id="profProgram"></div>
                        <div style="flex: 1;"><label>Specialization Snapshot</label> <input type="text" id="profSpec"></div>
                    </div>

                    <label style="margin-top:30px; font-size:1rem; color:var(--text-main); border-bottom: 1px solid var(--card-border); padding-bottom: 8px;">Contact Routing</label>
                    <div style="display: flex; flex-wrap: wrap; gap: 15px;">
                        <div style="flex:1; min-width: 250px;"><label>Academic Email</label><input type="text" id="profEmail"></div>
                        <div style="flex:1; min-width: 250px;"><label>Personal Email</label><input type="text" id="profPersonal"></div>
                        <div style="flex:1; min-width: 250px;"><label>Phone</label><input type="text" id="profPhone"></div>
                        <div style="flex:1; min-width: 250px;"><label>GitHub URL</label><input type="text" id="profGithub"></div>
                        <div style="flex:1; min-width: 250px;"><label>LinkedIn URL</label><input type="text" id="profLinkedin"></div>
                    </div>
                    <label>Let's Connect (Intro Text)</label> <textarea id="profContactIntro" rows="2"></textarea>

                    <button type="submit" class="btn primary">Deploy Profile Changes</button>
                </form>
            </div>
        </div>

        <!-- PROJECTS TAB -->
        <div id="content-projects" class="tab-content">
            <div class="card">
                <h2 id="projFormTitle" style="font-family:'Space Grotesk'; font-size: 1.4rem;">➕ Add Project</h2>
                <form id="projectForm">
                    <input type="hidden" id="projId">
                    <div style="display: flex; gap: 20px;">
                        <div style="flex: 3;"><label>Project Title</label><input type="text" id="projTitle" required></div>
                        <div style="flex: 1;"><label>Year</label><input type="text" id="projYear" required></div>
                    </div>
                    <label>Description</label> <textarea id="projDesc" rows="3" required></textarea>
                    <label>Technologies (Comma separated)</label> <input type="text" id="projTech" required placeholder="React, Express, MongoDB">
                    <div style="display: flex; gap: 10px;">
                        <button type="submit" class="btn primary" id="projBtn">Save Record</button>
                        <button type="button" class="btn btn-action" id="projCancel" style="display:none; margin-top:24px;" onclick="cancelEdit('projectForm','projId','projFormTitle','➕ Add Project','projBtn','projCancel')">Cancel</button>
                    </div>
                </form>
            </div>
            <div id="projectsList"></div>
        </div>

        <!-- EXPERIENCE TAB -->
        <div id="content-experience" class="tab-content">
            <div class="card">
                <h2 id="expFormTitle" style="font-family:'Space Grotesk'; font-size: 1.4rem;">➕ Add Experience</h2>
                <form id="expForm">
                    <input type="hidden" id="expId">
                    <div style="display: flex; gap: 20px;">
                        <div style="flex: 1;"><label>Company</label><input type="text" id="expComp" required></div>
                        <div style="flex: 1;"><label>Role</label><input type="text" id="expRole" required></div>
                    </div>
                    <label>Duration / Location</label> <input type="text" id="expDur" required placeholder="Remote | Feb 2025 - Aug 2025">
                    <label>Bullet Points (Press Enter for new bullet)</label> <textarea id="expBullets" rows="5" required></textarea>
                    <div style="display: flex; gap: 10px;">
                        <button type="submit" class="btn primary" id="expBtn">Save Record</button>
                        <button type="button" class="btn btn-action" id="expCancel" style="display:none; margin-top:24px;" onclick="cancelEdit('expForm','expId','expFormTitle','➕ Add Experience','expBtn','expCancel')">Cancel</button>
                    </div>
                </form>
            </div>
            <div id="experienceList"></div>
        </div>

        <!-- EDUCATION TAB -->
        <div id="content-education" class="tab-content">
            <div class="card">
                <h2 id="eduFormTitle" style="font-family:'Space Grotesk'; font-size: 1.4rem;">➕ Add Education</h2>
                <form id="educationForm">
                    <input type="hidden" id="eduId">
                    <div style="display: flex; gap: 20px;">
                        <div style="flex: 1;"><label>Degree (e.g., M.Tech CSE)</label><input type="text" id="eduDegree" required></div>
                        <div style="flex: 2;"><label>Institute</label><input type="text" id="eduInstitute" required></div>
                    </div>
                    <div style="display: flex; gap: 20px;">
                        <div style="flex: 1;"><label>Duration</label><input type="text" id="eduDuration" required></div>
                        <div style="flex: 1;"><label>Grade / CGPA</label><input type="text" id="eduGrade"></div>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button type="submit" class="btn primary" id="eduBtn">Save Record</button>
                        <button type="button" class="btn btn-action" id="eduCancel" style="display:none; margin-top:24px;" onclick="cancelEdit('educationForm','eduId','eduFormTitle','➕ Add Education','eduBtn','eduCancel')">Cancel</button>
                    </div>
                </form>
            </div>
            <div id="educationList"></div>
        </div>

        <!-- SKILLS TAB -->
        <div id="content-skills" class="tab-content">
            <div class="card">
                <h2 id="skillFormTitle" style="font-family:'Space Grotesk'; font-size: 1.4rem;">➕ Add Skill Category</h2>
                <form id="skillForm">
                    <input type="hidden" id="skillId">
                    <label>Category Group (e.g., Programming)</label> <input type="text" id="skillCat" required>
                    <label>Skills (Comma separated)</label> <input type="text" id="skillItems" required placeholder="Python, JavaScript, Node.js">
                    <div style="display: flex; gap: 10px;">
                        <button type="submit" class="btn primary" id="skillBtn">Save Record</button>
                        <button type="button" class="btn btn-action" id="skillCancel" style="display:none; margin-top:24px;" onclick="cancelEdit('skillForm','skillId','skillFormTitle','➕ Add Skill','skillBtn','skillCancel')">Cancel</button>
                    </div>
                </form>
            </div>
            <div id="skillsList"></div>
        </div>

        <!-- ACHIEVEMENTS TAB -->
        <div id="content-achievements" class="tab-content">
            <div class="card">
                <h2 id="achFormTitle" style="font-family:'Space Grotesk'; font-size: 1.4rem;">➕ Add Achievement</h2>
                <form id="achForm">
                    <input type="hidden" id="achId">
                    <div style="display: flex; gap: 20px;">
                        <div style="flex: 3;"><label>Achievement Title</label><input type="text" id="achTitle" required></div>
                        <div style="flex: 1;"><label>Year</label><input type="text" id="achYear" required></div>
                    </div>
                    <label>Short Description</label> <input type="text" id="achDesc" required>
                    <div style="display: flex; gap: 10px;">
                        <button type="submit" class="btn primary" id="achBtn">Save Record</button>
                        <button type="button" class="btn btn-action" id="achCancel" style="display:none; margin-top:24px;" onclick="cancelEdit('achForm','achId','achFormTitle','➕ Add Achievement','achBtn','achCancel')">Cancel</button>
                    </div>
                </form>
            </div>
            <div id="achievementsList"></div>
        </div>

        <!-- COURSES TAB -->
        <div id="content-courses" class="tab-content">
            <div class="card">
                <h2 id="courseFormTitle" style="font-family:'Space Grotesk'; font-size: 1.4rem;">➕ Add Course</h2>
                <form id="courseForm">
                    <input type="hidden" id="courseId">
                    <label>Course Title</label> <input type="text" id="courseName" required>
                    <div style="display: flex; gap: 10px;">
                        <button type="submit" class="btn primary" id="courseBtn" style="width: auto;">Add Course</button>
                        <button type="button" class="btn btn-action" id="courseCancel" style="display:none; margin-top:24px;" onclick="cancelEdit('courseForm','courseId','courseFormTitle','➕ Add Course','courseBtn','courseCancel')">Cancel</button>
                    </div>
                </form>
            </div>
            <div class="card" style="display:flex; flex-wrap:wrap; gap:10px;" id="coursesList"></div>
        </div>

    </main>

    <!-- THE MAGIC CROPPER MODAL -->
    <div id="cropModal">
        <div class="crop-container">
            <h2 style="margin-bottom: 15px; font-family:'Space Grotesk';">Crop Profile Avatar</h2>
            <div class="img-workspace">
                <img id="cropperImage" style="display: block; max-width: 100%;">
            </div>
            <div style="display: flex; gap: 15px;">
                <button onclick="applyCrop()" class="btn primary" style="margin-top:0;">Apply Crop & Compress</button>
                <button onclick="document.getElementById('cropModal').style.display='none'" class="btn btn-action" style="padding: 10px 20px;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        // === THEME LOGIC ===
        const themeBtn = document.getElementById('themeToggle');
        if(localStorage.getItem('theme') === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); themeBtn.innerHTML = '☀️ Light Mode'; }
        themeBtn.addEventListener('click', () => {
            if(document.documentElement.getAttribute('data-theme') === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light'); themeBtn.innerHTML = '🌙 Dark Mode';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark'); themeBtn.innerHTML = '☀️ Light Mode';
            }
        });

        // === CROPPER LOGIC (The Image Magic) ===
        let cropper = null;
        document.getElementById('profImageFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('cropperImage').src = event.target.result;
                    document.getElementById('cropModal').style.display = 'flex';
                    if(cropper) cropper.destroy();
                    // Set to 1:1 Aspect Ratio!
                    cropper = new Cropper(document.getElementById('cropperImage'), { aspectRatio: 1, viewMode: 1, autoCropArea: 1 });
                };
                reader.readAsDataURL(file);
                this.value = ''; // Reset input so you can re-upload same file if canceled
            }
        });

        function applyCrop() {
            // Extracts cropped image exactly at 300x300, compressed to 80% JPEG to save massive DB space!
            const canvas = cropper.getCroppedCanvas({ width: 300, height: 300 });
            const base64Str = canvas.toDataURL('image/jpeg', 0.8);
            
            document.getElementById('profImageBase64').value = base64Str;
            document.getElementById('imagePreview').src = base64Str;
            document.getElementById('cropModal').style.display = 'none';
            cropper.destroy(); cropper = null;
        }

        // === AUTH & DASHBOARD LOGIC ===
        const API = 'http://localhost:5000/api';
        if(localStorage.getItem('adminToken')) { 
            document.getElementById('loginWrapper').style.display = 'none'; 
            switchTab('profile'); 
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('adminPassword').value;
            const res = await fetch(`${API}/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
            const data = await res.json();
            if(res.ok) { 
                localStorage.setItem('adminToken', data.token); 
                document.getElementById('loginWrapper').style.display = 'none';
                switchTab('profile'); 
            } else { alert("❌ " + data.message); }
        });
        function logout() { localStorage.removeItem('adminToken'); location.reload(); }

        async function apiCall(endpoint, method = 'GET', body = null) {
            const opt = { method, headers: {} };
            if(localStorage.getItem('adminToken')) opt.headers['Authorization'] = `Bearer ${localStorage.getItem('adminToken')}`;
            if(body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
            const res = await fetch(`${API}/${endpoint}`, opt);
            if(res.status === 401 || res.status === 403) { logout(); throw new Error("Unauthorized"); }
            return res.json();
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content, .sidebar button').forEach(el => el.classList.remove('active'));
            document.getElementById(`content-${tabName}`).classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            const titles = { profile: 'Hero & Profile Setup', projects:'Manage Projects', experience:'Experience History', education:'Academic Background', skills:'Technical Arsenal', achievements:'Awards & Achievements', courses:'Key Coursework' };
            document.getElementById('dashboardTitle').innerText = titles[tabName];
            
            const map = { profile:loadProfile, projects:loadProjects, experience:loadExperience, education:loadEducation, skills:loadSkills, achievements:loadAchievements, courses:loadCourses };
            if(map[tabName]) map[tabName]();
        }

        function cancelEdit(formId, idField, titleId, txt, btnId, cancelId) {
            document.getElementById(formId).reset();
            document.getElementById(idField).value = '';
            document.getElementById(titleId).innerText = txt;
            document.getElementById(btnId).innerText = "Save Record";
            document.getElementById(cancelId).style.display = 'none';
        }

        async function deleteItem(col, id) {
            if(!confirm("Erase this from the database?")) return;
            await apiCall(`${col}/${id}`, 'DELETE');
            switchTab(col); 
        }

        // ================= CRUD LOGIC =================
        let state = {};

        // Profile
        async function loadProfile() {
            const data = await apiCall('profile');
            if(data.length > 0) {
                const p = data[0]; document.getElementById('profId').value = p._id;
                const m = { 'Name':'name','Eyebrow':'eyebrow','Subtitle':'heroSubtitle','Lead':'heroLead','About':'aboutText','Program':'currentProgram','Spec':'specialization','Phone':'phone','Email':'emailAcademic','Personal':'emailPersonal','Github':'github','Linkedin':'linkedin','ContactIntro':'contactIntro', 'ImageBase64':'imageUrl' };
                Object.keys(m).forEach(f => document.getElementById('prof'+f).value = p[m[f]] || '');
                if(p.imageUrl) document.getElementById('imagePreview').src = p.imageUrl;
            }
        }
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault(); const id = document.getElementById('profId').value;
